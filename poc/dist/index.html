<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PPT → 图片背景版 PPTX · PoC</title>
  <script type="module" crossorigin src="./assets/index-BdlWbYdV.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-DXPVfr29.css">
</head>
<body>
  <header>
    <h1>PPT → 图片背景版 PPTX <span class="tag">PoC</span></h1>
    <p class="sub">纯前端流水线：pptx-preview 渲染 → snapdom 出图 → PptxGenJS 以图片作背景重建 PPTX（不上传服务器）</p>
  </header>

  <section class="panel">
    <div class="row">
      <input id="file" type="file" accept=".pptx" />
      <button id="convert" disabled>开始转换</button>
      <a id="download" class="download" download style="display:none">下载结果 PPTX</a>
    </div>
    <div class="row meta">
      <label>渲染倍率 scale
        <input id="scale" type="number" min="1" max="4" step="0.5" value="2" style="width:64px" />
      </label>
      <label>JPEG 质量
        <input id="quality" type="number" min="0.5" max="1" step="0.01" value="0.92" style="width:72px" />
      </label>
      <span id="filemeta" class="muted"></span>
    </div>
  </section>

  <section class="panel">
    <h2>运行日志</h2>
    <pre id="log" class="log"></pre>
  </section>

  <section class="panel">
    <h2>输出结构自检（客观判据）</h2>
    <pre id="verify" class="verify">（尚未运行）</pre>
  </section>

  <section class="panel">
    <h2>渲染预览（左：输入渲染 / 右：输出 PPTX 回读）</h2>
    <div class="preview">
      <div class="col"><h3>输入渲染（图片来源）</h3><div id="left" class="thumbs"></div></div>
      <div class="col"><h3>输出回读（验证背景是否生效）</h3><div id="right" class="thumbs"></div></div>
    </div>
  </section>

  <!-- 渲染用的离屏容器 -->
  <div id="stage" aria-hidden="true"></div>

</body>
</html>
